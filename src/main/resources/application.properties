# ---------------------------------------------------------------------------
# Datasource - reactive PostgreSQL
# Dev Services will spin up a container automatically in dev/test mode.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

## Production overrides (set via env or config server)
%prod.quarkus.datasource.username=${DB_USERNAME:catawumpus}
%prod.quarkus.datasource.password=${DB_PASSWORD:catawumpus}
%prod.quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catawumpus}

# ---------------------------------------------------------------------------
# Hibernate Reactive
# ---------------------------------------------------------------------------
## Create/update schema on startup in dev; validate in prod
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=validate

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=Catawumpus API
quarkus.smallrye-openapi.info-version=1.0.0-SNAPSHOT
quarkus.smallrye-openapi.info-description=Catawumpus service API
quarkus.smallrye-openapi.info-contact-name=Catawumpus Team

## Expose Swagger UI in dev only (disabled in prod by default)
quarkus.swagger-ui.always-include=false
%dev.quarkus.swagger-ui.always-include=true

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
quarkus.http.port=8080

# ---------------------------------------------------------------------------
# Keycloak / OIDC
# ---------------------------------------------------------------------------
## Setting auth-server-url globally disables DevServices, so it is prod-only.
## DevServices auto-starts a Keycloak container in dev/test when this is absent.
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
%prod.quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}

quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:catawumpus-api}
quarkus.oidc.application-type=service

## Keycloak Authorization Services - enforce policies defined in Keycloak
quarkus.keycloak.policy-enforcer.enable=true

## Exclude Quarkus management endpoints from policy enforcement in all profiles
quarkus.keycloak.policy-enforcer.paths[0].name=Health and Observability
quarkus.keycloak.policy-enforcer.paths[0].paths=/q/health/*,/q/metrics/*,/q/openapi
quarkus.keycloak.policy-enforcer.paths[0].enforcement-mode=DISABLED

## Also exclude the entire /q/* space in dev (covers Dev UI, Swagger UI, etc.)
%dev.quarkus.keycloak.policy-enforcer.paths[1].name=Dev Endpoints
%dev.quarkus.keycloak.policy-enforcer.paths[1].paths=/q/*
%dev.quarkus.keycloak.policy-enforcer.paths[1].enforcement-mode=DISABLED

## Seed the DevServices Keycloak container with the dev realm in dev/test
%dev.quarkus.keycloak.devservices.realm-path=keycloak-realm-dev.json
%test.quarkus.keycloak.devservices.realm-path=keycloak-realm-dev.json

# ---------------------------------------------------------------------------
# OpenTelemetry
# ---------------------------------------------------------------------------
quarkus.otel.service.name=catawumpus
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true

## OTLP exporter - override in prod via env vars
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

## Disable the OTel SDK entirely in dev/test - no collector required
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
quarkus.log.level=INFO
%dev.quarkus.log.category."io.quarkus".level=DEBUG
